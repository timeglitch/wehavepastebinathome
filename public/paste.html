<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Paste</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" integrity="sha512-rO+olRTkcf304DQBxSWxln8JXCzTHlKnIdnMUwYvQa9/Jd4cQaNkItIUj6Z4nvW1dqK0SKXLbn9h4KwZTNtAyw==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <!-- SRI: the browser refuses these files if cdnjs ever serves different bytes; the decryption key in #fragment is readable by any script on this page. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" integrity="sha512-D9gUyxqja7hBtkWpPWGt9wfbfaMGVt9gnyCvYa+jojwwPHLCzUm5i8rpk7vD7wNee9bA35eYIjobYPaQuKS1MQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: monospace; background: #1a1a1a; color: #e0e0e0; padding: 2rem; }
    #container { max-width: 800px; margin: 0 auto; }
    #header { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
    /* Paste title; min-height so nothing jumps when it loads. */
    h1 { font-size: 1.4rem; color: #fff; flex: 1; min-height: 1.4em; }
    /* "+ New" sits in the action row next to Copy, in the same style. */
    #new-paste { padding: 0.4rem 0.9rem; background: #333; color: #ccc; border: 1px solid #555; border-radius: 3px;
                 font-size: 0.8rem; text-decoration: none; }
    #new-paste:hover { background: #444; }
    #site-footer { margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid #333; color: #666; font-size: 0.8rem; line-height: 1.8; }
    #site-footer a { color: #888; text-decoration: none; }
    #site-footer a:hover { color: #4a9eff; }
    #meta { font-size: 0.75rem; color: #666; margin-bottom: 1rem; }
    /* Lucide "lock" icon (ISC License, (c) Lucide Icons and Contributors) */
    #meta a { color: inherit; text-decoration: none; }
    #meta a:hover { color: #4a9eff; }
    #meta .lock { width: 1.1em; height: 1.1em; vertical-align: -0.2em; margin-right: 0.3em; fill: none;
                  stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    pre {
      border: 1px solid #333; border-radius: 3px;
      overflow-x: auto; font-size: 0.88rem; line-height: 1.5;
    }
    /* No empty box while loading or waiting for a password. */
    pre:has(code:empty) { display: none; }
    pre code { display: block; padding: 1rem; white-space: pre-wrap; word-break: break-word; }
    #error { color: #f87171; }
    #copy {
      padding: 0.4rem 0.9rem; background: #333; color: #ccc; border: 1px solid #555;
      border-radius: 3px; font-family: monospace; font-size: 0.8rem; cursor: pointer;
    }
    #copy:hover { background: #444; }
    #decrypt-panel { margin-bottom: 1rem; display: flex; gap: 0.6rem; align-items: center; }
    #decrypt-panel input {
      flex: 1; background: #2a2a2a; border: 1px solid #444; color: #e0e0e0;
      padding: 0.5rem 0.6rem; font-family: monospace; font-size: 0.9rem; border-radius: 3px;
    }
    #decrypt-panel button {
      padding: 0.5rem 1rem; background: #4a9eff; color: #fff;
      border: none; border-radius: 3px; font-family: monospace; cursor: pointer;
    }
    #decrypt-error { color: #f87171; font-size: 0.85rem; margin-bottom: 1rem; }
    @media (max-width: 600px) { body { padding: 1rem; } }
    #toast {
        position: fixed;
        left: 50%;
        bottom: 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1rem;
        background: #2a2a2a;
        color: #e0e0e0;
        border: 1px solid #444;
        border-radius: 6px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        font-size: 0.9rem;
        opacity: 0;
        transform: translate(-50%, 1rem);
        transition:
            opacity 0.2s,
            transform 0.2s;
        pointer-events: none;
    }
    #toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
    }
    #toast svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: #4ade80;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
    }
    @media (prefers-reduced-motion: reduce) {
        #toast {
            transform: translate(-50%, 0);
        }
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="header">
      <h1 id="title"></h1>
      <a id="new-paste" href="/" target="_blank" rel="noopener">+ New</a>
      <button id="copy" style="display:none">Copy</button>
    </div>
    <div id="meta"></div>
    <div id="decrypt-error" style="display:none"></div>
    <div id="decrypt-panel" style="display:none">
      <input id="dec-password" type="password" placeholder="Enter password to decrypt...">
      <button id="decrypt">Decrypt</button>
    </div>
    <pre><code id="content"></code></pre>
    <footer id="site-footer">
      <div>
        <p>Copy and paste with an easy-to-type URL. End-to-end encryption if you need it.</p>
        <p><a href="/#about">About</a> · <a href="https://github.com/timeglitch/wehavepastebinathome">GitHub</a></p>
      </div>
    </footer>
  </div>

  <script src="/crypto.js"></script>
  <script src="/toast.js"></script>
  <script src="/paste.js"></script>
</body>
</html>
